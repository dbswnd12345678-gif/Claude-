<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent — Claude Opus 4.6</title>
<style>
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #7c6af7;
    --accent-hover: #9585ff;
    --text: #e2e4f0;
    --text-muted: #8a8fa8;
    --user-bubble: #2b3060;
    --ai-bubble: #1e2235;
    --tool-bg: #141624;
    --tool-border: #3d4478;
    --success: #4caf8a;
    --warning: #f0b866;
    --error: #f07070;
    --radius: 12px;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  /* ── Layout ── */
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 4px 0 12px; border-bottom: 1px solid var(--border); }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .logo-text { font-weight: 700; font-size: 15px; }
  .logo-sub { font-size: 11px; color: var(--text-muted); }

  .sidebar-section { display: flex; flex-direction: column; gap: 6px; }
  .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; padding: 4px 0; }

  /* Buttons */
  .btn {
    padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: #fff; justify-content: center; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--error); border: 1px solid var(--error); }
  .btn-danger:hover { background: rgba(240,112,112,.12); }

  /* Tools badge list */
  .tools-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .tool-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(124,106,247,.15); color: var(--accent); border: 1px solid rgba(124,106,247,.3);
  }

  /* ── Main chat area ── */
  .main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  .chat-header h1 { font-size: 16px; font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 6px; }
  .status-dot.busy { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  /* ── Message bubbles ── */
  .msg { display: flex; gap: 12px; max-width: 860px; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-start; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .avatar.user { background: var(--accent); color: #fff; }
  .avatar.ai { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px; border-radius: var(--radius);
    line-height: 1.65; font-size: 14px; max-width: 720px;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

  /* Markdown inside bubbles */
  .bubble p { margin-bottom: .6em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: rgba(255,255,255,.08); border-radius: 4px;
    padding: 2px 5px; font-family: var(--font-mono); font-size: 13px;
  }
  .bubble pre {
    background: #0d0f1a; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 4px; font-weight: 600; }
  .bubble ul,.bubble ol { padding-left: 18px; }
  .bubble li { margin-bottom: 2px; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
  .bubble th,.bubble td { border: 1px solid var(--border); padding: 6px 10px; }
  .bubble th { background: var(--surface2); }

  /* Tool call cards */
  .tool-card {
    background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: 10px; padding: 10px 14px; margin: 8px 0;
    font-size: 12px;
  }
  .tool-card .tool-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    font-weight: 600; color: var(--accent);
  }
  .tool-card .tool-header .icon { font-size: 15px; }
  .tool-card .tool-body { color: var(--text-muted); font-family: var(--font-mono); }
  .tool-card.executing .tool-header::after {
    content: ''; display: inline-block; width: 8px; height: 8px;
    border: 2px solid var(--accent); border-top-color: transparent;
    border-radius: 50%; animation: spin .6s linear infinite; margin-left: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-result-preview {
    margin-top: 6px; padding: 6px 10px;
    background: rgba(255,255,255,.04); border-radius: 6px;
    color: var(--text-muted); font-size: 11px; font-family: var(--font-mono);
    max-height: 80px; overflow: hidden; position: relative;
  }
  .tool-result-preview::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 20px; background: linear-gradient(transparent, var(--tool-bg));
  }

  /* Thinking indicator */
  .thinking-label {
    font-size: 11px; color: var(--text-muted); font-style: italic;
    padding: 4px 0; display: flex; align-items: center; gap: 6px;
  }

  /* Typing cursor */
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); animation: blink .8s step-end infinite; vertical-align: text-bottom; margin-left: 1px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Input bar ── */
  .input-area {
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-box {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
    color: var(--text); font-size: 14px; font-family: inherit;
    resize: none; outline: none; max-height: 160px; min-height: 48px;
    line-height: 1.5; transition: border-color .2s;
  }
  .input-box:focus { border-color: var(--accent); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-size: 18px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: background .15s; align-self: flex-end;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  /* Welcome screen */
  .welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 24px; padding: 40px;
    text-align: center; color: var(--text-muted);
  }
  .welcome .big-icon { font-size: 64px; }
  .welcome h2 { font-size: 22px; color: var(--text); }
  .welcome p { max-width: 480px; line-height: 1.7; }
  .capability-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 480px; width: 100%; }
  .cap-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 4px; text-align: left;
  }
  .cap-card .cap-icon { font-size: 22px; }
  .cap-card .cap-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .cap-card .cap-desc { font-size: 12px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 20px; font-size: 13px; z-index: 9999; opacity: 0;
    transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast.success { border-color: var(--success); color: var(--success); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>
<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <div class="logo-text">AI Agent</div>
        <div class="logo-sub">Claude Opus 4.6</div>
      </div>
    </div>

    <!-- Session -->
    <div class="sidebar-section">
      <div class="sidebar-label">Session</div>
      <code id="session-id-display" style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">—</code>
      <button class="btn btn-danger" onclick="clearSession()">🗑 대화 초기화</button>
    </div>

    <!-- Tools -->
    <div class="sidebar-section">
      <div class="sidebar-label">활성 도구</div>
      <div class="tools-list" id="tools-list"></div>
    </div>

  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="chat-header">
      <div>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">준비됨</span>
      </div>
      <h1>AI Agent Chat</h1>
      <div style="font-size:12px;color:var(--text-muted);" id="msg-count">메시지 0개</div>
    </div>

    <div class="messages" id="messages">
      <!-- Welcome screen shown initially -->
      <div class="welcome" id="welcome">
        <div class="big-icon">✨</div>
        <h2>Claude AI 에이전트에 오신 것을 환영합니다</h2>
        <p>무엇이든 물어보세요. AI가 웹 검색과 Google Docs/Sheets 도구를 활용해 답변합니다.</p>
        <div class="capability-grid">
          <div class="cap-card"><div class="cap-icon">🔍</div><div class="cap-title">웹 검색</div><div class="cap-desc">실시간 정보 검색</div></div>
          <div class="cap-card"><div class="cap-icon">📝</div><div class="cap-title">Google Docs</div><div class="cap-desc">문서 읽기 / 편집</div></div>
          <div class="cap-card"><div class="cap-icon">📊</div><div class="cap-title">Google Sheets</div><div class="cap-desc">스프레드시트 연동</div></div>
          <div class="cap-card"><div class="cap-icon">🧠</div><div class="cap-title">심층 추론</div><div class="cap-desc">복잡한 문제 분석</div></div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea class="input-box" id="user-input" placeholder="메시지를 입력하세요… (Shift+Enter: 줄바꿈, Enter: 전송)"
                  rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" title="전송">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let sessionId = null;
let isBusy = false;
let msgCount = 0;

// ── Init ─────────────────────────────────────────────────────────────────────
(async () => {
  const resp = await fetch('/api/session', { method: 'POST' });
  const data = await resp.json();
  sessionId = data.session_id;
  document.getElementById('session-id-display').textContent = sessionId;

  const toolResp = await fetch('/api/tools');
  const toolData = await toolResp.json();
  const list = document.getElementById('tools-list');
  toolData.tools.forEach(t => {
    const badge = document.createElement('div');
    badge.className = 'tool-badge';
    badge.textContent = t;
    list.appendChild(badge);
  });
})();

// ── UI helpers ────────────────────────────────────────────────────────────────
function setBusy(busy) {
  isBusy = busy;
  document.getElementById('status-dot').className = 'status-dot' + (busy ? ' busy' : '');
  document.getElementById('status-text').textContent = busy ? '처리 중…' : '준비됨';
  document.getElementById('send-btn').disabled = busy;
}

function updateMsgCount() {
  msgCount++;
  document.getElementById('msg-count').textContent = `메시지 ${msgCount}개`;
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

// ── Clear session ─────────────────────────────────────────────────────────────
async function clearSession() {
  if (!confirm('대화를 초기화할까요?')) return;
  await fetch(`/api/session/${sessionId}`, { method: 'DELETE' });
  document.getElementById('messages').innerHTML = '';
  msgCount = 0;
  document.getElementById('msg-count').textContent = '메시지 0개';
  // Re-add welcome
  const w = document.createElement('div');
  w.id = 'welcome';
  w.className = 'welcome';
  w.innerHTML = `<div class="big-icon">✨</div><h2>대화가 초기화되었습니다</h2><p>새로운 대화를 시작해보세요.</p>`;
  document.getElementById('messages').appendChild(w);
  showToast('대화가 초기화되었습니다', 'success');
}

// ── Render message ─────────────────────────────────────────────────────────────
function createMessageEl(role) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  document.getElementById('messages').appendChild(msg);
  scrollBottom();
  return bubble;
}

// Simple markdown→HTML (subset)
function renderMarkdown(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // code blocks
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,lang,code) =>
      `<pre><code class="lang-${lang}">${code.trim()}</code></pre>`)
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // headings
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // unordered list
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`)
    // ordered list
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // horizontal rule
    .replace(/^---$/gm, '<hr/>')
    // line breaks → paragraphs
    .split('\n\n').map(p => p.startsWith('<') ? p : `<p>${p.replace(/\n/g,'<br/>')}</p>`).join('');
}

// ── Send message ───────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text || isBusy) return;

  input.value = '';
  input.style.height = 'auto';
  setBusy(true);
  updateMsgCount();

  // User bubble
  const userBubble = createMessageEl('user');
  userBubble.innerHTML = renderMarkdown(text);

  // AI bubble
  const aiBubble = createMessageEl('ai');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  aiBubble.appendChild(cursor);

  let textAccum = '';
  let lastToolCard = null;

  try {
    const resp = await fetch(`/api/chat/${sessionId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        message: text,
      }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        if (event.type === 'text') {
          textAccum += event.content;
          cursor.remove();
          aiBubble.innerHTML = renderMarkdown(textAccum);
          aiBubble.appendChild(cursor);
          scrollBottom();
        } else if (event.type === 'tool_start') {
          // Insert tool card before cursor
          cursor.remove();
          const card = document.createElement('div');
          card.className = 'tool-card executing';
          card.dataset.toolId = event.id;
          card.innerHTML = `
            <div class="tool-header"><span class="icon">${toolIcon(event.name)}</span> ${event.name}</div>
            <div class="tool-body">준비 중…</div>`;
          aiBubble.appendChild(card);
          aiBubble.appendChild(cursor);
          lastToolCard = card;
          scrollBottom();
        } else if (event.type === 'tool_executing') {
          if (lastToolCard) {
            lastToolCard.querySelector('.tool-body').textContent =
              JSON.stringify(event.input, null, 2).slice(0, 200);
          }
        } else if (event.type === 'tool_result') {
          if (lastToolCard) {
            lastToolCard.classList.remove('executing');
            const prev = document.createElement('div');
            prev.className = 'tool-result-preview';
            prev.textContent = event.result;
            lastToolCard.appendChild(prev);
            lastToolCard = null;
          }
          scrollBottom();
        } else if (event.type === 'done') {
          cursor.remove();
          updateMsgCount();
        }
      }
    }
  } catch (err) {
    cursor.remove();
    aiBubble.innerHTML += `<p style="color:var(--error)">오류: ${err.message}</p>`;
    showToast('오류가 발생했습니다: ' + err.message, 'error');
  } finally {
    setBusy(false);
    scrollBottom();
  }
}

function toolIcon(name) {
  const map = {
    web_search: '🔍', read_google_doc: '📄', write_google_doc: '✍️',
    read_google_sheet: '📊', write_google_sheet: '📊',
    analyze_uploaded_file: '🔬', search_uploaded_files: '📂',
  };
  return map[name] || '🔧';
}
</script>
</body>
</html>
